body{background-color:#060713;background-image:radial-gradient(ellipse at 12% -5%,#33205e 0,transparent 38%),radial-gradient(ellipse at 100% 18%,#101f48 0,transparent 32%),linear-gradient(180deg,#080817,#060713 65%)}
#main{padding-top:12px}
.q{background:rgba(255,255,255,.055);border-color:rgba(190,170,255,.17);box-shadow:inset 0 1px rgba(255,255,255,.035);transition:border-color .2s,box-shadow .2s}
.q:focus{outline:none;border-color:var(--acl);box-shadow:0 0 0 3px color-mix(in srgb,var(--acl) 17%,transparent)}
.box{background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));box-shadow:0 12px 28px #0002;backdrop-filter:blur(16px)}
.chip,.ib,.hr,.back,.fv{transition:transform .18s ease,border-color .18s ease,background .18s ease}
.chip:active,.ib:active,.btn:active,.hr:active{transform:scale(.97)}
.btn{position:relative;overflow:hidden}
.btn:not(.o)::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,#ffffff35 48%,transparent 68%);transform:translateX(-120%);transition:transform .6s}
.btn:not(.o):hover::after{transform:translateX(120%)}
.lux-spot{isolation:isolate;position:relative;display:flex;align-items:center;min-height:188px;overflow:hidden;border-radius:24px;margin:14px 0 18px;padding:20px 16px;border:1px solid #c4b5fd38;background:linear-gradient(120deg,#19132e 0%,#17142f 48%,#0e2340 100%);box-shadow:0 18px 38px #0004,inset 0 1px #ffffff12}
.lux-spot-glow{position:absolute;z-index:-1;width:180px;height:180px;border-radius:50%;right:4%;top:-50px;background:#8b5cf6;filter:blur(65px);opacity:.48}
.lux-spot-copy{position:relative;z-index:2;max-width:72%}
.lux-eyebrow{font-size:9px;font-weight:700;letter-spacing:.2em;color:#c4b5fd}
.lux-spot h2{font-size:25px;letter-spacing:-.04em;margin:7px 0 5px}
.lux-spot p{font-size:12px;line-height:1.5;color:#c4c0df;margin-bottom:13px;max-width:250px}
.lux-spot .btn{min-height:42px;padding:10px 14px;font-size:12px;white-space:nowrap}
.lux-orb{position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:112px;height:142px;display:grid;place-items:center;pointer-events:none}
.lux-orb:before,.lux-orb:after{content:"";position:absolute;border:1px solid #c4b5fd6e;border-radius:50%;width:92px;height:92px;transform:rotate(-25deg) scaleY(.42)}
.lux-orb:after{width:112px;height:112px;transform:rotate(52deg) scaleY(.42);border-color:#67e8f988}
.lux-orb span{font-size:54px;color:#e9d5ff;text-shadow:0 0 28px #c084fc;animation:luxfloat 4s ease-in-out infinite}
.lux-orb i,.lux-orb b{position:absolute;width:7px;height:7px;border-radius:50%;background:#67e8f9;box-shadow:0 0 14px #67e8f9;top:25px;right:31px}
.lux-orb b{width:5px;height:5px;top:auto;right:auto;bottom:23px;left:20px;background:#f0abfc;box-shadow:0 0 12px #f0abfc}
@keyframes luxfloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}
nav{background:rgba(8,8,24,.88);box-shadow:0 -10px 35px #0002}
@media(min-width:760px){.lux-spot{min-height:210px;padding:28px 30px}.lux-spot-copy{max-width:68%}.lux-spot h2{font-size:32px}.lux-orb{right:7%;transform:translateY(-50%) scale(1.25)}}
@media(prefers-reduced-motion:reduce){.lux-orb span{animation:none}.btn:not(.o)::after{display:none}}


.photo-launch{display:flex;align-items:center;gap:12px;margin:12px 0 18px;padding:14px;border-color:#a78bfa35;background:linear-gradient(120deg,#17142c,#101c32)}
.photo-launch-icon{flex:0 0 42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#a855f7,#38bdf8);font-size:22px;box-shadow:0 0 24px #8b5cf644}
.photo-launch-copy{flex:1;min-width:0}.photo-launch-copy b{font-size:13px}.photo-launch-copy p{font-size:11px;margin-top:3px}.photo-launch .btn{padding:10px 12px;min-height:38px;font-size:11px;white-space:nowrap}
.photo-studio{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(90% 50% at 50% 0,#25164b,#070816 65%);padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.photo-studio[hidden]{display:none}.ps-wrap{max-width:760px;margin:auto}.ps-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.ps-head h2{font-size:20px}.ps-preview{position:relative;overflow:hidden;width:min(100%,360px);aspect-ratio:9/16;margin:0 auto 18px;border-radius:24px;background:#11152b;border:1px solid #ffffff24;box-shadow:0 20px 60px #0007}.ps-preview img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(var(--pb,1)) contrast(var(--pc,1)) saturate(var(--ps,1)) hue-rotate(var(--ph,0deg)) blur(var(--pbl,0px))}.ps-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ps-control{padding:12px;border:1px solid var(--line);background:#ffffff08;border-radius:14px}.ps-control label{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:7px}.ps-control input{width:100%;accent-color:#a78bfa}.ps-actions{display:flex;gap:10px;margin-top:14px}.ps-actions .btn{flex:1}.ps-note{font-size:11px;color:var(--mut);text-align:center;margin:12px 0 0}@media(max-width:420px){.photo-launch{flex-wrap:wrap}.photo-launch-copy{min-width:calc(100% - 58px);}.photo-launch .btn{width:100%}.ps-controls{grid-template-columns:1fr}}


/* LUXORA 2.2 — adaptive phone + tablet refinement */
:root{color-scheme:dark;--lux-radius:22px}
html{scroll-behavior:smooth}
body{min-height:100dvh;overscroll-behavior-y:contain}
button,input,select{font:inherit}
button{touch-action:manipulation;cursor:pointer}
button:focus-visible,[role="button"]:focus-visible,input:focus-visible{outline:2px solid #67e8f9;outline-offset:3px}
img{max-width:100%}
#main{width:100%;min-width:0}
.top{border-bottom:1px solid rgba(255,255,255,.045)}
.hd{gap:12px}
.hd h2{letter-spacing:-.025em}
.box,.photo-launch,.lux-spot{border-radius:var(--lux-radius)}
.grid .c,.row .c,.ci{isolation:isolate}
.photo-studio[hidden]{display:none!important}
.photo-studio:not([hidden]){display:block}
.ps-wrap{width:min(100%,960px);margin:0 auto}
.ps-preview{max-width:460px;margin:0 auto 18px}
.ps-actions{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,#070816 28%)}
/* Small phones: keep controls comfortably tappable without horizontal overflow. */
@media(max-width:390px){
  #main{padding-left:12px;padding-right:12px}
  .lux-spot{padding:17px 13px;min-height:176px}
  .lux-spot-copy{max-width:76%}
  .lux-spot h2{font-size:22px}
  .lux-orb{right:-22px;transform:translateY(-50%) scale(.88)}
  .photo-launch{gap:9px;padding:11px}
  .photo-launch .btn{font-size:10px;padding:9px}
  nav button{min-width:0;flex:1;font-size:10px}
  nav .cb{flex:0 0 54px;width:54px}
  .stats{gap:6px}.stats div{padding:10px 6px}
}
/* Tablet: use the available canvas like a studio, not a stretched phone screen. */
@media(min-width:760px){
  :root{--pd:28px;--cw:270px}
  #main{max-width:1360px;padding:24px clamp(24px,3vw,48px) 40px}
  .top{margin:0 calc(-1 * clamp(24px,3vw,48px));padding-left:clamp(24px,3vw,48px);padding-right:clamp(24px,3vw,48px)}
  .lux-spot{min-height:238px;padding:32px 36px}
  .lux-spot h2{font-size:36px}
  .lux-spot p{font-size:14px;max-width:340px}
  .lux-orb{transform:translateY(-50%) scale(1.48);right:9%}
  .hd{margin-top:26px;margin-bottom:14px}
  .hd h2{font-size:20px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}
  .grid.l{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .row{gap:14px}
  .row .c{width:166px}
  .box{padding:20px}
  .photo-studio{padding:28px clamp(24px,4vw,60px) calc(30px + env(safe-area-inset-bottom,0px))}
  .ps-wrap{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(300px,1.1fr);gap:18px 30px;align-items:start}
  .ps-head{grid-column:1/-1}
  .ps-preview{grid-column:1;grid-row:2/4;width:100%;max-width:420px}
  .ps-controls{grid-column:2;grid-row:2}
  .ps-actions{grid-column:2;grid-row:3;position:static}
  .ps-note{grid-column:1/-1}
}
@media(min-width:1180px){
  body{padding-left:244px}
  nav{width:244px;padding:22px 16px}
  #main{padding-top:28px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
  .row .c{width:182px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

else if(a=='rst'){if(!S.rc){S.rc=true;render()}else{['fv','ff','ip','nm','ac','bs','sk','cl','tf','dl','sf','ent','dev'].forEach(k=>{try{localStorage.removeItem(k)}catch(x){}});favs=[];FF=[];CL=[];DL=[];SF=[];ENT={pro:false,own:[]};DEV=false;TF=false;bs=false;AC=0;S.ipk=0;S.rc=false;render();toast('Your data was reset')}}
else if(a=='spal'){S.sp=+v;render()}else if(a=='ssh'){S.sh=SHP.indexOf(v);render()}
else if(a=='mood')go('grid',{mood:v});else if(a=='sup'){S.id=Math.floor(Math.random()*W.length);render()}
else if(a=='edit'){E={b:100,c:100,s:100,h:0,bl:0,v:0};S.ed=true;render()}else if(a=='edone'){S.ed=false;render()}
else if(a=='ereset'){E={b:100,c:100,s:100,h:0,bl:0,v:0};render()}
else if(a=='theme')go('theme');else if(a=='tsv'){TF=!TF;sv('tf',TF);render()}else if(a=='tap'){if(isLocked('t','aurora'))openPay('t','aurora');else{S.tap=!S.tap;render()}}
else if(a=='tstd')go('studio',{sp:3,sh:0,ss:3,sn:60});else if(a=='ticn'){S.ipk=1;sv('ip',1);go('icons')}else if(a=='tfnt')go('fonts',{ft:2});
else if(a=='cp'){S.cp=!S.cp;render()}
else if(a=='cpick'){const c=CL[+v];c.ids=c.ids.includes(S.id)?c.ids.filter(x=>x!=S.id):[...c.ids,S.id];svC();render()}
else if(a=='cpnew'){const n=$('#cpn').value.trim();if(!n)toast('Type a name first');else{CL.push({n,ids:[S.id]});svC();render()}}
else if(a=='cnew'){const n=$('#cnm').value.trim();if(!n)toast('Type a name first');else{CL.push({n,ids:[]});svC();render()}}
else if(a=='cview'){S.cv=+v;render();scrollTo(0,0)}
else if(a=='cdel'){if(S.cd!=+v){S.cd=+v;render()}else{CL.splice(+v,1);svC();S.cv=null;S.cd=null;render()}}
else if(a=='ssc'){S.sc=v;render()}else if(a=='splay'){playSound(+v);render()}
else if(a=='sfav'){const i=+v;SF=SF.includes(i)?SF.filter(x=>x!=i):[...SF,i];sv('sf',SF);render()}
else if(a=='sndown'){downloadSound(+v)}
else if(a=='sset'){S.sq=+v;render()}else if(a=='sx'){S.sq=null;render()}
else if(a=='sapp'){const i=S.sq;S.sq=null;render();if(isLocked('s',i))openPay('s',i);else if(!APP)toast('Setting a sound works inside the Android app. This web preview is a demo.');else{toast('Preparing sound…');sndWav(i).then(b=>Luxora.setSound(b,SND[i].n.replace(/[^A-Za-z0-9]+/g,'-'),v)).catch(()=>toast('Could not prepare the sound'))}}
else if(a=='unl')openPay(b.dataset.t,isNaN(+v)?v:+v);
else if(a=='pro'){S.pw=null;go('pro')}else if(a=='buy')buy(v);
else if(a=='rest')toast('Restore will work once payments are live.');
else if(a=='ver'){VT++;if(VT>=7){VT=0;DEV=!DEV;sv('dev',DEV);toast(DEV?'Developer test mode ON':'Developer test mode OFF');render()}}
else if(a=='entreset'){ENT={pro:false,own:[]};sv('ent',ENT);render()}
else if(a=='dl2'){if(isLocked('w',S.id))openPay('w',S.id);else if(!APP)toast('Download works inside the Android app. This web preview is a demo.');else{const w=W[S.id];toast('Preparing download…');wPng(w).then(b=>Luxora.saveImage(b,'LUXORA-'+w.name.replace(/[^A-Za-z0-9]+/g,'-'))).catch(()=>toast('Could not prepare the image'))}}
else if(a=='ap'){if(isLocked('w',S.id))openPay('w',S.id);else if(!APP)toast('Apply works inside the Android app. This web preview is a demo.');else{S.ap=true;render()}}
else if(a=='apx'){S.ap=false;render()}
else if(a=='apt'){const w=W[S.id];S.ap=false;render();toast('Applying wallpaper…');wPng(w,S.ed?ef():null).then(b=>Luxora.applyWallpaper(b,v)).catch(()=>toast('Could not prepare the image'))}
else if(a=='sh'){try{navigator.share?navigator.share({title:'LUXORA · '+W[+v].name}):toast('Share not available in this browser')}catch(x){toast('Could not share')}}});
document.addEventListener('input',e=>{if(e.target.dataset.e){E[e.target.dataset.e]=+e.target.value;$('#epv').style.filter=ef();$('#evg').style.opacity=E.v/100;return}if(e.target.id=='sps'){S.ss=+e.target.value;return}if(e.target.id=='spn'){S.sn=+e.target.value;stopStudio();startStudio();return}if(e.target.id=='pnm'){sv('nm',e.target.value);$('#pav').textContent=(e.target.value.trim()[0]||'G').toUpperCase();return}if(e.target.id=='ftx'||e.target.id=='fsz'){fv();return}if(e.target.id=='gq'){S.q=e.target.value;S.n=30;$('#res').innerHTML=res()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='hq'){go('grid',{q:e.target.value})}});
$('#photoPicker').addEventListener('change',e=>openPhotoStudio(e.target.files&&e.target.files[0]));document.addEventListener('input',e=>{if(e.target.matches('[data-photo-filter]'))updatePhotoFilter()});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(car,150)});render();
</script></body></html>
